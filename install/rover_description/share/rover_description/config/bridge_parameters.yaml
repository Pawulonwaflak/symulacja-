# ros_gz_bridge - config_file
#
# UWAGA: przy 'config_file' parametr 'arguments' jest IGNOROWANY.
# /clock musi byc TUTAJ, inaczej use_sim_time nie dziala nigdzie
# i spawnery kontrolerow timeoutuja.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Ground truth - tylko do weryfikacji promienia skretu.
# Docelowo liczysz wlasna odometrie z enkoderow.
- ros_topic_name: "/odom_ground_truth"
  gz_topic_name: "/model/rover/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
