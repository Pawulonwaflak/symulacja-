services:
  rover_sim:
    build: .
    image: symulacja--rover_sim:latest
    container_name: rover_sim_container
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
    volumes:
      # Przekierowanie okien X11 z hosta do kontenera (dla Gazebo i RViz)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Podpięcie katalogu src na żywo (edycja kodu bez przebudowywania obrazu)
      - ./src:/ros2_ws/src:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    command: bash